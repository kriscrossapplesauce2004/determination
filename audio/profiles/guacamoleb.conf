# Direct-audio ownership profile for the recon-verified OnePlus 7 card.
# Mixer and PCM route data are intentionally absent until the first on-device
# snapshot/restore qualification. This profile can arbitrate ownership only.
schema=1
profile=guacamoleb
card_contains=sm8150-tavil-snd-card
service=audioserver
service=vendor.audio-hal
timeout_ms=5000
