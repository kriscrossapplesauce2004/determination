# Hardware profile is shared with the guacamoleb port name.
DET_PROFILE_ID=guacamoleb
DET_BACKLIGHT_PATH=/sys/class/backlight/backlight/brightness
DET_BACKLIGHT_LEVEL=1400
DET_WIFI_IFACE=wlan0
DET_DRM_CARD=/dev/dri/card0
DET_BATTERY_GAUGE=bms
DET_INPUT_QUIRK=oneplus-touchpanel-zero-axes
DET_LINUX_FIRST_SUPPORTED=1
DET_LINUX_FIRST_KEEP_NETWORK=1
DET_LINUX_FIRST_FREEZE_SYSTEM_SERVER=1
