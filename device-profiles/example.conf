# Determination device profile. Values omitted here are discovered at runtime.
# Copy to /data/determination/etc/device.conf only when discovery is wrong.
DET_PROFILE_ID=example
# DET_BACKLIGHT_PATH=/sys/class/backlight/panel0-backlight/brightness
# DET_BACKLIGHT_LEVEL=800
# DET_WIFI_IFACE=wlan0
# DET_DRM_CARD=/dev/dri/card0
# DET_DRM_RENDER_NODE=/dev/dri/renderD128
# DET_BATTERY_GAUGE=bms
# DET_INPUT_QUIRK=none
# DET_HWC_OUTPUT=HWCOMPOSER-1
# Vendor blobs through libhybris are the compatibility default. Minigbm is
# the compositor-facing GBM implementation, not the GPU renderer.
# DET_GRAPHICS_RENDERER=libhybris
# DET_GBM_PROVIDER=minigbm
# DET_PANEL_WIDTH=1080
# DET_PANEL_HEIGHT=2400
# DET_OUTPUT_SCALE=3
# Space-separated device nodes needed by an uncommon GPU/display stack.
# DET_EXTRA_DEVICES="/dev/vendor_gpu /dev/vendor_allocator"
# DET_LINUX_FIRST_SUPPORTED=0
# DET_LINUX_FIRST_KEEP_NETWORK=1
# DET_LINUX_FIRST_FREEZE_SYSTEM_SERVER=1
