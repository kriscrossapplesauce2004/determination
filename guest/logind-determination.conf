# Determination: guest /etc/systemd/logind.conf.d/determination.conf
# The fake udev DB (det-input-udevdb) hands logind the input devices, which
# means logind ALSO sees the phone's power button (qpnp_pon) --- and its
# default HandlePowerKey=poweroff SHUT DOWN THE CONTAINER whenever the power
# button was pressed during a native session (2026-07-14: two mystery
# "container deaths", black screen mid-plasma). Ignore all hardware keys;
# kwin/phosh handle them in-session.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
